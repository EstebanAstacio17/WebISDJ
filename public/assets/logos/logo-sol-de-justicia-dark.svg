<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D1" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <linearGradient id="textGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>

    <linearGradient id="sunDarkVariant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3748" />
      <stop offset="50%" stop-color="#1A202C" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <radialGradient id="sunGlowDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </radialGradient>

    <filter id="glowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.7" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <path id="textArcDark" d="M 90 280 A 210 210 0 0 1 510 280" fill="none" />
  </defs>

  <!-- Arched Title "IGLESIA SOL DE JUSTICIA" with Radiant White-Gold Tone -->
  <g font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-weight="900" font-size="34" letter-spacing="4">
    <text fill="url(#textGoldGrad)" filter="url(#glowDark)">
      <textPath href="#textArcDark" startOffset="50%" text-anchor="middle">
        IGLESIA SOL DE JUSTICIA
      </textPath>
    </text>
  </g>

  <!-- Sun Rays & Glow Background (Sol de Justicia) -->
  <g transform="translate(300, 360)">
    <!-- Radiant Halo -->
    <circle r="150" fill="url(#sunGlowDark)" />

    <!-- Outer Multi-point Geometric Sun Burst -->
    <g fill="url(#sunDarkVariant)" stroke="#D4AF37" stroke-width="1.5" opacity="0.95">
      <polygon points="0,-130 35,-95 92,-92 95,-35 130,0 95,35 92,92 35,95 0,130 -35,95 -92,92 -95,35 -130,0 -95,-35 -92,-92 -35,-95" />
      <polygon points="0,-120 40,-75 110,-60 85,-10 115,45 65,75 50,120 0,90 -50,120 -65,75 -115,45 -85,-10 -110,-60 -40,-75" transform="rotate(15)" opacity="0.7" fill="#3B4252" />
    </g>

    <!-- Yellow / Gold Aura Rings -->
    <circle r="75" fill="none" stroke="url(#goldGradDark)" stroke-width="8" opacity="0.9" />
    <circle r="85" fill="none" stroke="#FDE68A" stroke-width="2" stroke-dasharray="4 6" opacity="0.95" />
  </g>

  <!-- Open Bible Illustration -->
  <g transform="translate(300, 395)">
    <!-- Bible Dark Base -->
    <path d="M -160 30 Q -80 -15 0 20 Q 80 -15 160 30 L 140 70 Q 70 30 0 55 Q -70 30 -140 70 Z" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5" />
    
    <!-- Outer Pages (White/Luminous) -->
    <path d="M -155 20 Q -80 -25 0 10 Q 80 -25 155 20 L 145 55 Q 75 15 0 42 Q -75 15 -145 55 Z" fill="#FFFFFF" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Top Pages Layer -->
    <path d="M -150 15 Q -75 -28 0 5 L 0 38 Q -75 5 -140 48 Z" fill="#FFFFFF" />
    <path d="M 150 15 Q 75 -28 0 5 L 0 38 Q 75 5 140 48 Z" fill="#F8FAFC" />

    <!-- Page Center Spine & Scripture Lines -->
    <path d="M 0 5 L 0 42" stroke="#D97706" stroke-width="2" />
    <path d="M -130 10 Q -75 -18 -15 8" fill="none" stroke="#CBD5E1" stroke-width="1.5" />
    <path d="M -130 20 Q -75 -8 -15 18" fill="none" stroke="#CBD5E1" stroke-width="1.5" />
    <path d="M 130 10 Q 75 -18 15 8" fill="none" stroke="#CBD5E1" stroke-width="1.5" />
    <path d="M 130 20 Q 75 -8 15 18" fill="none" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- Red Ribbon Bookmark -->
    <path d="M 0 25 Q 15 50 25 90 L 15 95 L 0 75 L -10 92 L -18 86 Q -5 45 0 25 Z" fill="#EF4444" />
    <path d="M 0 35 Q 35 60 45 80 L 35 85 Q 25 65 0 42 Z" fill="#F59E0B" opacity="0.9" />
  </g>

  <!-- Central Gothic Monogram "RJF" in High-Grade Luminous Beveled Gold -->
  <g transform="translate(300, 275)" filter="url(#glowDark)">
    <!-- Base outline -->
    <g fill="url(#goldGradDark)" stroke="#451A03" stroke-width="3" stroke-linejoin="round">
      <path d="M -90 40 L -65 -60 Q -50 -75 -20 -70 Q 0 -65 0 -35 Q 0 -10 -25 -2 L 5 70 L -25 70 L -45 5 L -60 5 L -65 65 L -95 65 Z M -60 -15 L -35 -15 Q -15 -15 -15 -35 Q -15 -52 -35 -52 L -55 -52 Z" />
      <path d="M -15 -75 L 35 -75 L 35 -55 L 15 -55 L 15 35 Q 15 75 -25 75 Q -55 75 -60 50 L -35 45 Q -32 55 -20 55 Q -5 55 -5 30 L -5 -55 L -20 -55 Z" />
      <path d="M 20 -75 L 85 -75 L 85 -55 L 45 -55 L 45 -20 L 75 -20 L 75 0 L 45 0 L 40 65 L 15 65 L 20 -75 Z" />
    </g>

    <!-- Bevel Highlights -->
    <g fill="#FFFBEB" opacity="0.9">
      <path d="M -85 35 L -63 -55 Q -48 -68 -22 -65 Q -5 -60 -5 -35 Q -5 -12 -28 -5 L -2 65 L -20 65 L -42 2 L -58 2 L -63 60 L -88 60 Z M -58 -18 L -35 -18 Q -18 -18 -18 -35 Q -18 -48 -35 -48 L -53 -48 Z" opacity="0.4" />
      <circle cx="-60" cy="-60" r="3.5" fill="#FFF" />
      <circle cx="80" cy="-70" r="3.5" fill="#FFF" />
    </g>
  </g>
</svg>
