<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="favBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0A1128" />
    </radialGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <!-- Circular background tile with subtle gold border -->
  <circle cx="64" cy="64" r="62" fill="url(#favBg)" stroke="url(#favGold)" stroke-width="3" />

  <!-- Sunburst glow -->
  <circle cx="64" cy="64" r="38" fill="#F59E0B" opacity="0.25" />
  
  <!-- Geometric Sun Star -->
  <g transform="translate(64, 64) scale(0.48)" fill="#292025" stroke="#D4AF37" stroke-width="2">
    <polygon points="0,-100 28,-72 72,-68 72,-28 100,0 72,28 72,72 28,68 0,100 -28,68 -72,72 -72,28 -100,0 -72,-28 -72,-68 -28,-72" />
    <circle r="50" fill="none" stroke="url(#favGold)" stroke-width="6" />
  </g>

  <!-- Open Bible Symbol -->
  <g transform="translate(64, 76) scale(0.38)">
    <path d="M -90 15 Q -45 -15 0 8 Q 45 -15 90 15 L 80 40 Q 40 12 0 30 Q -40 12 -80 40 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="3" />
    <path d="M 0 10 L 0 30" stroke="#D97706" stroke-width="3" />
    <path d="M 0 18 Q 10 35 15 60 L 5 50 L -2 60 Q -5 35 0 18 Z" fill="#EF4444" />
  </g>

  <!-- Monogram RJF in Gold -->
  <g transform="translate(64, 48) scale(0.42)" fill="url(#favGold)" stroke="#451A03" stroke-width="2">
    <path d="M -50 20 L -38 -30 Q -30 -40 -12 -36 Q 0 -32 0 -15 Q 0 -4 -12 0 L 4 35 L -12 35 L -24 4 L -32 4 L -36 35 L -52 35 Z" />
    <path d="M -8 -40 L 20 -40 L 20 -28 L 8 -28 L 8 16 Q 8 40 -12 40 Q -28 40 -32 28 L -20 24 Q -16 28 -10 28 Q -2 28 -2 16 L -2 -28 L -8 -28 Z" />
    <path d="M 12 -40 L 48 -40 L 48 -28 L 24 -28 L 24 -10 L 42 -10 L 42 2 L 24 2 L 22 36 L 8 36 Z" />
  </g>
</svg>
